<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070c1a">
<title>Oficina · Painel de atendimento</title>
<style>
:root{
  --bg:#070c1a;--pop:#0f172e;--surface:rgba(255,255,255,.045);--surface2:rgba(255,255,255,.08);
  --border:rgba(255,255,255,.1);--text:#e8ecf5;--muted:#8f9ab5;--brand:#6366f1;
  --shadow:0 12px 32px rgba(0,0,0,.35);
  --c0:#94a3b8;--c1:#ef4444;--c2:#f59e0b;--c3:#3b82f6;--c4:#22c55e;
  --c:var(--c0);--on:#0f172a;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f2f5fb;--pop:#ffffff;--surface:#ffffff;--surface2:#eef2f8;
  --border:rgba(15,23,42,.1);--text:#0f172a;--muted:#5b6780;
  --shadow:0 10px 28px rgba(15,23,42,.08);
  color-scheme:light;
}
[data-s="0"]{--c:var(--c0);--on:#0f172a}
[data-s="1"]{--c:var(--c1);--on:#ffffff}
[data-s="2"]{--c:var(--c2);--on:#1f1300}
[data-s="3"]{--c:var(--c3);--on:#ffffff}
[data-s="4"]{--c:var(--c4);--on:#052e12}

*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);line-height:1.35;min-height:100vh;
  background:
    radial-gradient(900px 460px at 12% -12%,color-mix(in srgb,var(--c) 20%,transparent),transparent 62%),
    radial-gradient(700px 420px at 100% 0%,rgba(99,102,241,.13),transparent 60%),
    var(--bg);
  background-attachment:fixed;
}
.i{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- Topo ---------- */
.top{
  position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 16px;background:color-mix(in srgb,var(--bg) 78%,transparent);
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);
}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:22px;color:#fff;
  background:linear-gradient(135deg,var(--brand),#8b5cf6);box-shadow:0 6px 18px rgba(99,102,241,.4);flex:none}
.brand h1{font-size:17px;font-weight:700;letter-spacing:.2px}
.brand p{font-size:12px;color:var(--muted)}
.tools{display:flex;align-items:center;gap:8px}
.clock{text-align:right;margin-right:6px;font-variant-numeric:tabular-nums}
.clock b{display:block;font-size:16px}
.clock span{font-size:11px;color:var(--muted)}
.icon-btn{width:38px;height:38px;border-radius:11px;border:1px solid var(--border);background:var(--surface);color:var(--text);
  display:grid;place-items:center;font-size:18px;cursor:pointer;transition:background .2s,transform .1s,color .2s}
.icon-btn:hover{background:var(--surface2)}
.icon-btn:active{transform:scale(.94)}
.icon-btn.danger:hover{color:var(--c1)}
.icon-btn.off{color:var(--muted)}
.conn{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--muted);padding:0 12px;height:38px;
  border-radius:11px;border:1px solid var(--border);background:var(--surface);white-space:nowrap}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--c4);box-shadow:0 0 8px var(--c4)}
.conn.off i{background:var(--c1);box-shadow:0 0 8px var(--c1)}
.offline{background:var(--c1);color:#fff;text-align:center;font-size:13px;font-weight:600;padding:8px 12px}

/* ---------- Estrutura ---------- */
.page{max-width:1240px;margin:0 auto;padding:20px 16px 8px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.kpi{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--surface);
  border:1px solid var(--border);box-shadow:var(--shadow)}
.kic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:21px;flex:none;
  background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.kpi b{display:block;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.layout{display:grid;grid-template-columns:minmax(0,1fr) 410px;gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.panel+.panel{margin-top:20px}
.ph{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 6px}
.ph h2{font-size:15px;font-weight:700}
.col-detail{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto;scrollbar-width:thin}

/* ---------- Botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface2);color:var(--text);font:inherit;font-size:14px;font-weight:600;
  cursor:pointer;transition:transform .1s,filter .2s,background .2s}
.btn:hover{filter:brightness(1.12)}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed;pointer-events:none}
.btn .i{font-size:17px}
.btn.primary{background:var(--brand);border-color:transparent;color:#fff}
.btn.sm{height:34px;padding:0 12px;font-size:13px}
.btn.big{height:52px;font-size:16px;width:100%;border-radius:14px}
.btn.next{background:var(--c);border-color:transparent;color:var(--on);box-shadow:0 8px 22px color-mix(in srgb,var(--c) 40%,transparent)}
.btn.ghost{background:transparent;width:100%;margin-top:10px}
.link{background:none;border:0;color:var(--muted);font:inherit;font-size:12px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--text)}

/* ---------- Busca e filtros ---------- */
.search{display:flex;align-items:center;gap:10px;margin:8px 18px 0;padding:0 12px;height:40px;border-radius:12px;
  border:1px solid var(--border);background:var(--surface2);color:var(--muted)}
.search:focus-within{border-color:var(--brand)}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--text);font:inherit;font-size:14px}
.chips{display:flex;gap:8px;padding:12px 18px;overflow-x:auto;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;height:32px;padding:0 12px;border-radius:999px;
  border:1px solid var(--border);background:transparent;color:var(--muted);font:inherit;font-size:13px;font-weight:600;
  cursor:pointer;transition:all .2s}
.chip b{font-size:11px;min-width:20px;text-align:center;padding:1px 6px;border-radius:99px;background:var(--surface2);color:var(--text)}
.chip:hover{color:var(--text)}
.chip.on{background:color-mix(in srgb,var(--c) 18%,transparent);border-color:color-mix(in srgb,var(--c) 55%,transparent);color:var(--text)}

/* ---------- Lista de veículos ---------- */
.list{display:grid;gap:10px;padding:4px 18px 12px}
.car{position:relative;display:flex;align-items:center;gap:14px;padding:14px 14px 14px 18px;border-radius:16px;
  background:var(--surface);border:1px solid var(--border);cursor:pointer;outline:none;
  transition:transform .12s,border-color .2s,background .2s,box-shadow .2s}
.car::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.car:hover{background:var(--surface2)}
.car:active{transform:scale(.985)}
.car:focus-visible{box-shadow:0 0 0 2px var(--brand)}
.car.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 10%,transparent);
  box-shadow:0 0 0 1px var(--c) inset,0 10px 28px color-mix(in srgb,var(--c) 18%,transparent)}
.av{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:none;
  background:color-mix(in srgb,var(--c) 16%,transparent);color:var(--c)}
.ci{flex:1;min-width:0}
.cm{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cs{display:flex;align-items:center;gap:8px;margin-top:5px;min-width:0}
.ct{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cr{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.trow{display:flex;align-items:center;gap:6px}
.led{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;
  color:var(--c);background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 38%,transparent)}
.badge .i{font-size:13px}
.tm{font-variant-numeric:tabular-nums;font-size:12px;color:var(--muted);font-weight:600}
.vazio{padding:34px 18px;text-align:center;color:var(--muted);font-size:14px}
.vazio .i{font-size:36px;display:block;margin:0 auto 10px;opacity:.55}
.pf{display:flex;justify-content:center;padding:4px 18px 16px}

/* ---------- Placa Mercosul ---------- */
.plate{display:inline-flex;flex-direction:column;align-items:center;border-radius:6px;overflow:hidden;flex:none;
  background:#f8fafc;color:#0f172a;border:1px solid #cbd5e1;padding:0 8px 2px;
  font:800 13px/1.15 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:2px}
.plate::before{content:"BRASIL";display:block;align-self:stretch;margin:0 -8px 2px;background:#1d4ed8;color:#fff;
  font:700 6px/1 system-ui,sans-serif;letter-spacing:2px;text-align:center;padding:2px 0}
.plate.sm{font-size:11px;padding:0 6px 1px}
.plate.sm::before{margin:0 -6px 1px}

/* ---------- Detalhe ---------- */
.detail{padding:18px}
.dh{display:flex;align-items:center;gap:14px}
.dh .av{width:54px;height:54px;font-size:28px}
.di{flex:1;min-width:0}
.dm{font-size:19px;font-weight:800;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ac{display:flex;gap:6px}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.meta div,.timers div{padding:10px 12px;border-radius:12px;background:var(--surface2)}
.meta span,.timers span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:2px}
.meta b{font-size:14px;font-weight:600;word-break:break-word}
.hero{display:flex;align-items:center;gap:16px;margin-top:16px;padding:16px;border-radius:16px;
  background:color-mix(in srgb,var(--c) 12%,transparent);border:1px solid color-mix(in srgb,var(--c) 35%,transparent)}
.orb{position:relative;width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:28px;flex:none;
  background:var(--c);color:var(--on);box-shadow:0 0 28px color-mix(in srgb,var(--c) 60%,transparent)}
.orb.live::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid var(--c);opacity:0;animation:ping 2s ease-out infinite}
@keyframes ping{0%{transform:scale(.9);opacity:.8}100%{transform:scale(1.4);opacity:0}}
.hn{font-size:22px;font-weight:800}
.hd{font-size:13px;color:var(--muted);margin-top:2px}
.timers{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.timers .tm{display:block;font-size:20px;font-weight:700;color:var(--text)}
.stepper{display:flex;margin:20px 0 4px}
.st{flex:1;position:relative;text-align:center;font-size:11px;color:var(--muted);font-weight:600}
.st::before{content:"";position:absolute;top:13px;left:-50%;width:100%;height:2px;background:var(--border)}
.st:first-child::before{display:none}
.st .dotc{position:relative;z-index:1;width:28px;height:28px;border-radius:50%;margin:0 auto 6px;display:grid;place-items:center;
  font-size:12px;font-weight:800;background:var(--pop);border:2px solid var(--border)}
.st .dotc .i{font-size:14px}
.st.done::before,.st.now::before{background:var(--c)}
.st.done .dotc{background:var(--c);border-color:var(--c);color:var(--on)}
.st.now .dotc{border-color:var(--c);color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
.st.done,.st.now{color:var(--text)}
.sect{font-size:11px;letter-spacing:1.6px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:20px 2px 10px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.act{display:flex;align-items:center;gap:10px;padding:12px;border-radius:14px;border:1px solid var(--border);
  background:var(--surface);color:var(--text);font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:left;
  transition:transform .1s,background .2s,border-color .2s}
.act:hover{background:var(--surface2)}
.act:active{transform:scale(.97)}
.act .ai{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:18px;flex:none;
  background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.act.on{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);box-shadow:0 0 0 1px var(--c) inset}
kbd{margin-left:auto;font:600 11px ui-monospace,monospace;color:var(--muted);border:1px solid var(--border);border-radius:6px;padding:1px 6px}
.hint{margin-top:14px;font-size:11px;color:var(--muted);text-align:center}

/* ---------- Histórico ---------- */
.log{list-style:none;padding:6px 18px 14px}
.log li{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--border);font-size:13px}
.log li:last-child{border-bottom:0}
.ld{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;flex:none;
  background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.lx{flex:1;min-width:0}
.lx small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.log .vazio{padding:20px 0}
footer{text-align:center;color:var(--muted);font-size:12px;padding:20px 16px 28px}

/* ---------- Diálogo e avisos ---------- */
dialog{margin:auto;border:1px solid var(--border);border-radius:20px;background:var(--pop);color:var(--text);padding:0;
  width:min(440px,calc(100% - 32px));box-shadow:0 30px 80px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(2,6,23,.62);backdrop-filter:blur(4px)}
.fm{padding:20px}
.fm h3{font-size:18px;margin-bottom:14px}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-size:12px;color:var(--muted);margin-bottom:5px;font-weight:600}
.fld input{width:100%;height:42px;padding:0 12px;border-radius:11px;border:1px solid var(--border);background:var(--surface2);
  color:var(--text);font:inherit;font-size:15px;outline:0}
.fld input:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(99,102,241,.25)}
.fld input[name=placa]{text-transform:uppercase;letter-spacing:2px;font-weight:700}
.fa{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.toasts{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom));transform:translateX(-50%);display:grid;gap:8px;
  z-index:50;width:min(380px,calc(100% - 32px));pointer-events:none}
.toast{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--pop);
  border:1px solid var(--border);box-shadow:var(--shadow);font-size:14px;font-weight:600;animation:in .25s ease}
.toast .i{font-size:18px;color:var(--c4)}
.toast.err .i{color:var(--c1)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* ---------- Responsivo ---------- */
@media (max-width:980px){
  .layout{grid-template-columns:1fr}
  .col-detail{position:static;max-height:none;overflow:visible}
}
@media (max-width:720px){
  .kpis{grid-template-columns:repeat(2,1fr)}
  .clock,.brand p{display:none}
}
@media (hover:none){kbd,.hint{display:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<div class="offline" id="offline" hidden>Sem comunicação com o ESP32. Tentando reconectar…</div>

<header class="top">
  <div class="brand">
    <div class="logo"><svg class="i"><use href="#i-tool"/></svg></div>
    <div><h1>Oficina</h1><p>Painel de atendimento</p></div>
  </div>
  <div class="tools">
    <div class="clock"><b id="hora">--:--</b><span id="data"></span></div>
    <button class="icon-btn" id="btnSom" aria-label="Alerta sonoro"></button>
    <button class="icon-btn" id="btnTema" aria-label="Alternar tema"></button>
    <div class="conn" id="conn"><i></i><span>Conectando…</span></div>
  </div>
</header>

<main class="page">
  <section class="kpis">
    <div class="kpi" style="--c:var(--brand)"><div class="kic"><svg class="i"><use href="#i-car"/></svg></div><div><b id="k0">0</b><span>Veículos no pátio</span></div></div>
    <div class="kpi" data-s="0"><div class="kic"><svg class="i"><use href="#i-inbox"/></svg></div><div><b id="k1">0</b><span>Na fila</span></div></div>
    <div class="kpi" data-s="3"><div class="kic"><svg class="i"><use href="#i-tool"/></svg></div><div><b id="k2">0</b><span>Em atendimento</span></div></div>
    <div class="kpi" data-s="4"><div class="kic"><svg class="i"><use href="#i-check"/></svg></div><div><b id="k3">0</b><span>Prontos para retirada</span></div></div>
  </section>

  <div class="layout">
    <section>
      <div class="panel">
        <div class="ph">
          <h2>Veículos</h2>
          <button class="btn primary sm" id="btnNovo"><svg class="i"><use href="#i-plus"/></svg>Novo veículo</button>
        </div>
        <label class="search">
          <svg class="i"><use href="#i-search"/></svg>
          <input id="busca" type="search" placeholder="Buscar por placa, modelo ou cliente" autocomplete="off">
        </label>
        <div class="chips" id="chips"></div>
        <div class="list" id="lista"><div class="vazio">Carregando…</div></div>
        <div class="pf"><button class="link" id="btnZerar">Reiniciar o status de todos os veículos</button></div>
      </div>
    </section>

    <aside class="col-detail">
      <div class="panel detail" id="detalhe"></div>
      <div class="panel">
        <div class="ph"><h2>Atividade recente</h2></div>
        <ul class="log" id="log"></ul>
      </div>
    </aside>
  </div>
</main>

<footer id="sys">oficina.local</footer>

<dialog id="dlg">
  <form class="fm" id="fm" autocomplete="off">
    <h3 id="fTitulo">Novo veículo</h3>
    <input type="hidden" name="vid" value="-1">
    <label class="fld"><span>Modelo e ano</span><input name="modelo" required maxlength="40" placeholder="Ex.: Honda Civic 2018"></label>
    <label class="fld"><span>Placa</span><input name="placa" required maxlength="8" placeholder="ABC1D23"></label>
    <label class="fld"><span>Cliente</span><input name="cliente" maxlength="40" placeholder="Nome do cliente"></label>
    <label class="fld"><span>Serviço</span><input name="servico" maxlength="60" placeholder="Ex.: Revisão e troca de óleo"></label>
    <div class="fa">
      <button type="button" class="btn" id="fCancel">Cancelar</button>
      <button type="submit" class="btn primary">Salvar</button>
    </div>
  </form>
</dialog>

<div class="toasts" id="toasts"></div>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js"></script>
<script>
(function(){
"use strict";

var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var ic=function(n,x){return '<svg class="i '+(x||"")+'"><use href="#i-'+n+'"/></svg>'};

var ST=[
  {n:"Na fila",c:"Fila",i:"inbox",d:"Aguardando o início do atendimento"},
  {n:"Cliente solicitado",c:"Chamado",i:"bell",d:"Cliente chamado ao balcão"},
  {n:"Diagnóstico",c:"Diagnóstico",i:"search",d:"Veículo em avaliação técnica"},
  {n:"Manutenção",c:"Manutenção",i:"tool",d:"Serviço em execução na oficina"},
  {n:"Finalizado",c:"Pronto",i:"check",d:"Serviço concluído, pronto para retirada"}
];

var D=null,rec=0,sel=-1,filtro=-1,busca="",busy=false,pend=false,lock=false,online=null;

var el=function(){return (Date.now()-rec)/1000};
var pad=function(n){return String(n).padStart(2,"0")};
function fmt(s){s=Math.max(0,Math.floor(s));var h=Math.floor(s/3600),m=Math.floor(s%3600/60);return (h?h+":":"")+pad(m)+":"+pad(s%60)}
function ago(s){s=Math.floor(s);if(s<5)return"agora";if(s<60)return"há "+s+" s";if(s<3600)return"há "+Math.floor(s/60)+" min";if(s<86400)return"há "+Math.floor(s/3600)+" h";return"há "+Math.floor(s/86400)+" d"}
function setHTML(n,h){if(n._h!==h){n._h=h;n.innerHTML=h}}
function cur(){return D?(D.carros.find(function(c){return c.id===sel})||null):null}
function passa(c){return (filtro<0||c.estado===filtro)&&(!busca||(c.modelo+" "+c.placa+" "+c.cliente+" "+c.servico).toLowerCase().indexOf(busca)>=0)}

/* ---------- Comunicação ---------- */
/* MQTT: mesmas rotas do ESP32 (/status, /cmd, /salvar...), enviadas pelo broker */
var MQTT_URL="wss://broker.hivemq.com:8884/mqtt";
var BASE="etec3a/oficina/k7x9q2";   /* tem que ser igual ao MQTT_BASE do ESP32 */
var CID="w"+Math.random().toString(36).slice(2,10),rid=0,pronto=false,pend_={};
var mq=mqtt.connect(MQTT_URL,{clientId:"oficina-web-"+CID,reconnectPeriod:2000});
mq.on("connect",function(){mq.subscribe(BASE+"/res/"+CID,function(err){pronto=!err})});
mq.on("close",function(){pronto=false});
mq.on("offline",function(){pronto=false});
mq.on("error",function(){pronto=false});
mq.on("message",function(t,m){
  var s=m.toString(),a=s.indexOf("|"),b=s.indexOf("|",a+1);
  if(a<0||b<0)return;
  var p=pend_[s.slice(0,a)];
  if(!p)return;
  delete pend_[s.slice(0,a)];
  clearTimeout(p.t);
  var st=parseInt(s.slice(a+1,b),10),corpo=s.slice(b+1);
  p.ok({ok:st>=200&&st<300,status:st,
    json:function(){return Promise.resolve(JSON.parse(corpo))},
    text:function(){return Promise.resolve(corpo)}});
});
function api(path){
  return new Promise(function(ok,erro){
    if(!pronto){erro(new Error("mqtt"));return}
    var id=String(++rid);
    var t=setTimeout(function(){delete pend_[id];erro(new Error("timeout"))},5000);
    pend_[id]={ok:ok,t:t};
    mq.publish(BASE+"/req",CID+"|"+id+"|"+path);
  });
}
function setOnline(v){
  if(online===v)return;
  online=v;
  $("#offline").hidden=v;
  var c=$("#conn");
  c.classList.toggle("off",!v);
  c.querySelector("span").textContent=v?"Online":"Sem conexão";
}
function poll(){
  if(busy){pend=true;return}
  busy=true;
  api("/status").then(function(r){return r.json()}).then(function(d){
    D=d;rec=Date.now();setOnline(true);render();
  }).catch(function(){setOnline(false)}).then(function(){
    busy=false;
    if(pend){pend=false;poll()}
  });
}

/* ---------- Avisos ---------- */
function toast(msg,tipo){
  var d=document.createElement("div");
  d.className="toast"+(tipo==="err"?" err":"");
  d.innerHTML=ic(tipo==="err"?"trash":"check")+"<span></span>";
  d.lastChild.textContent=msg;
  $("#toasts").appendChild(d);
  setTimeout(function(){d.remove()},2800);
}

/* ---------- Renderização ---------- */
function render(){
  var lista=D.carros;
  if(!lista.some(function(c){return c.id===sel}))sel=lista.length?lista[0].id:-1;

  var n=function(f){return lista.filter(f).length};
  $("#k0").textContent=lista.length;
  $("#k1").textContent=n(function(c){return c.estado===0});
  $("#k2").textContent=n(function(c){return c.estado>0&&c.estado<4});
  $("#k3").textContent=n(function(c){return c.estado===4});

  var defs=[{f:-1,t:"Todos"}].concat(ST.map(function(s,i){return{f:i,t:s.c}}));
  setHTML($("#chips"),defs.map(function(d){
    var q=d.f<0?lista.length:n(function(c){return c.estado===d.f});
    return '<button class="chip'+(filtro===d.f?" on":"")+'" data-f="'+d.f+'"'+(d.f<0?' style="--c:var(--brand)"':' data-s="'+d.f+'"')+'>'+esc(d.t)+' <b>'+q+'</b></button>';
  }).join(""));

  var vis=lista.filter(passa);
  setHTML($("#lista"),vis.length?vis.map(carHtml).join(""):
    '<div class="vazio">'+ic("car")+(lista.length?"Nenhum veículo encontrado.":"Nenhum veículo cadastrado.<br>Use o botão “Novo veículo”.")+'</div>');

  var sc=cur();
  setHTML($("#detalhe"),sc?detHtml(sc):'<div class="vazio">'+ic("car")+'Selecione um veículo<br>ou cadastre um novo.</div>');
  document.body.dataset.s=sc?sc.estado:0;

  setHTML($("#log"),D.log.length?D.log.map(logHtml).join(""):'<li class="vazio">Sem atividade ainda.</li>');

  setHTML($("#btnSom"),ic(D.som?"vol":"mute"));
  $("#btnSom").classList.toggle("off",!D.som);
  $("#btnSom").title=D.som?"Alerta sonoro ligado":"Alerta sonoro desligado";
  $("#btnNovo").disabled=lista.length>=D.max;
  tick();
}

function carHtml(c){
  var s=ST[c.estado];
  var meta=[c.cliente,c.servico].filter(Boolean).map(esc).join(" · ");
  return '<div class="car'+(c.id===sel?" sel":"")+'" data-s="'+c.estado+'" data-id="'+c.id+'" tabindex="0" role="button">'+
    '<div class="av">'+ic("car")+'</div>'+
    '<div class="ci"><div class="cm">'+esc(c.modelo)+'</div><div class="cs"><span class="plate sm">'+esc(c.placa)+'</span><span class="ct">'+meta+'</span></div></div>'+
    '<div class="cr"><span class="badge">'+ic(s.i)+s.c+'</span>'+
    '<span class="trow">'+(c.id===D.ultimo&&c.estado>0?'<span class="led" title="Exibido nos LEDs da bancada"></span>':'')+
    '<span class="tm" data-id="'+c.id+'" data-k="desde">--:--</span></span></div></div>';
}

function detHtml(c){
  var s=ST[c.estado],nx=c.estado<4?c.estado+1:-1,i,h;
  h='<div class="dh" data-s="'+c.estado+'"><div class="av">'+ic("car")+'</div><div class="di"><div class="dm">'+esc(c.modelo)+'</div><span class="plate">'+esc(c.placa)+'</span></div>'+
    '<div class="ac"><button class="icon-btn" data-act="edit" title="Editar" aria-label="Editar">'+ic("edit")+'</button>'+
    '<button class="icon-btn danger" data-act="del" title="Remover" aria-label="Remover">'+ic("trash")+'</button></div></div>';
  h+='<div class="meta"><div><span>Cliente</span><b>'+esc(c.cliente||"—")+'</b></div><div><span>Serviço</span><b>'+esc(c.servico||"—")+'</b></div></div>';
  h+='<div class="hero" data-s="'+c.estado+'"><div class="orb'+(c.estado>0&&c.estado<4?" live":"")+'">'+ic(s.i)+'</div><div><div class="hn">'+s.n+'</div><div class="hd">'+s.d+'</div></div></div>';
  h+='<div class="timers"><div><span>Neste status</span><b class="tm" data-id="'+c.id+'" data-k="desde">--:--</b></div>'+
     '<div><span>No pátio</span><b class="tm" data-id="'+c.id+'" data-k="entrada">--:--</b></div></div>';
  h+='<div class="stepper">';
  for(i=1;i<=4;i++){
    h+='<div class="st'+(c.estado>i?" done":(c.estado===i?" now":""))+'" data-s="'+i+'"><div class="dotc">'+(c.estado>i?ic("check"):i)+'</div>'+ST[i].c+'</div>';
  }
  h+='</div><div class="sect">Atualizar status</div>';
  h+=nx>0?'<button class="btn next big" data-act="set" data-e="'+nx+'" data-s="'+nx+'">'+ic(ST[nx].i)+'Avançar: '+ST[nx].n+ic("arrow")+'</button>':
          '<button class="btn big" disabled>'+ic("check")+'Atendimento concluído</button>';
  h+='<div class="acts">';
  for(i=1;i<=4;i++){
    h+='<button class="act'+(c.estado===i?" on":"")+'" data-act="set" data-e="'+i+'" data-s="'+i+'"><span class="ai">'+ic(ST[i].i)+'</span>'+ST[i].c+'<kbd>'+i+'</kbd></button>';
  }
  h+='</div><button class="btn ghost" data-act="set" data-e="0">'+ic("pause")+'Voltar para a fila<kbd>0</kbd></button>';
  h+='<div class="hint">Atalhos: 1–4 status · 0 fila · ↑ ↓ trocar veículo · N novo veículo</div>';
  return h;
}

function logHtml(e){
  var s,ico,txt;
  if(e.estado===10){s=4;ico="plus";txt="Veículo cadastrado: <b>"+esc(e.modelo)+"</b>"}
  else if(e.estado===11){s=1;ico="trash";txt="Veículo removido: <b>"+esc(e.modelo)+"</b>"}
  else{s=e.estado;ico=ST[s].i;txt="<b>"+esc(e.modelo)+"</b> → "+ST[s].n}
  return '<li data-s="'+s+'"><div class="ld">'+ic(ico)+'</div><div class="lx">'+txt+
    '<small><span class="lt" data-ev="'+e.id+'">agora</span> · '+esc(e.placa)+'</small></div></li>';
}

/* ---------- Cronômetros ---------- */
function tick(){
  var now=new Date();
  $("#hora").textContent=now.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit"});
  $("#data").textContent=now.toLocaleDateString("pt-BR",{weekday:"short",day:"2-digit",month:"short"});
  if(!D)return;
  var e=el();
  document.querySelectorAll(".tm").forEach(function(n){
    var c=D.carros.find(function(x){return x.id==n.dataset.id});
    if(c)n.textContent=fmt(c[n.dataset.k]+e);
  });
  document.querySelectorAll(".lt").forEach(function(n){
    var v=D.log.find(function(x){return x.id==n.dataset.ev});
    if(v)n.textContent=ago(v.ha+e);
  });
  $("#sys").textContent="ESP32 · "+D.ip+" · oficina.local · Wi-Fi "+D.rssi+" dBm · ligado há "+fmt(D.up+e);
}

/* ---------- Ações ---------- */
function selecionar(id,rolar){
  sel=id;
  if(D)render();
  if(rolar&&window.innerWidth<=980)$("#detalhe").scrollIntoView({behavior:"smooth",block:"start"});
}

function setStatus(e){
  var c=cur();
  if(!c||lock)return;
  lock=true;
  api("/cmd?c="+e+"&car="+c.id).then(function(r){
    if(!r.ok)throw new Error("cmd");
    toast(c.modelo+" → "+ST[e].n);
    poll();
  }).catch(function(){toast("Falha ao enviar o comando","err")}).then(function(){
    setTimeout(function(){lock=false},250);
  });
}

function remover(c){
  if(!confirm("Remover "+c.modelo+" ("+c.placa+") do painel?"))return;
  api("/remover?car="+c.id).then(function(r){
    if(!r.ok)throw new Error("del");
    toast("Veículo removido");poll();
  }).catch(function(){toast("Falha ao remover","err")});
}

var dlg=$("#dlg"),fm=$("#fm");
function abrirForm(c){
  $("#fTitulo").textContent=c?"Editar veículo":"Novo veículo";
  fm.elements.vid.value=c?c.id:-1;
  fm.elements.modelo.value=c?c.modelo:"";
  fm.elements.placa.value=c?c.placa:"";
  fm.elements.cliente.value=c?c.cliente:"";
  fm.elements.servico.value=c?c.servico:"";
  dlg.showModal();
  fm.elements.modelo.focus();
}

async function salvar(){
  var f=fm.elements,novo=Number(f.vid.value)<0;
  var q="car="+f.vid.value+
    "&modelo="+encodeURIComponent(f.modelo.value.trim())+
    "&placa="+encodeURIComponent(f.placa.value.toUpperCase().replace(/\s/g,""))+
    "&cliente="+encodeURIComponent(f.cliente.value.trim())+
    "&servico="+encodeURIComponent(f.servico.value.trim());
  try{
    var r=await api("/salvar?"+q);
    if(r.status===409){toast("Limite de veículos atingido","err");return}
    if(!r.ok)throw new Error("save");
    var id=parseInt(await r.text(),10);
    if(!isNaN(id))sel=id;
    dlg.close();
    toast(novo?"Veículo cadastrado":"Veículo atualizado");
    poll();
  }catch(e){toast("Falha ao salvar","err")}
}

/* ---------- Eventos ---------- */
$("#detalhe").addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");
  var c=cur();
  if(!b||!c)return;
  var a=b.dataset.act;
  if(a==="set")setStatus(Number(b.dataset.e));
  else if(a==="edit")abrirForm(c);
  else if(a==="del")remover(c);
});
$("#lista").addEventListener("click",function(e){
  var c=e.target.closest(".car");
  if(c)selecionar(Number(c.dataset.id),true);
});
$("#chips").addEventListener("click",function(e){
  var b=e.target.closest(".chip");
  if(!b||!D)return;
  filtro=Number(b.dataset.f);render();
});
$("#busca").addEventListener("input",function(){
  busca=this.value.trim().toLowerCase();
  if(D)render();
});
$("#btnNovo").addEventListener("click",function(){abrirForm(null)});
$("#btnZerar").addEventListener("click",function(){
  if(!confirm("Voltar todos os veículos para “Na fila”?"))return;
  api("/zerar").then(function(){toast("Status reiniciados");poll()}).catch(function(){toast("Falha ao reiniciar","err")});
});
$("#btnSom").addEventListener("click",function(){
  if(!D)return;
  api("/som?v="+(D.som?0:1)).then(function(){poll()}).catch(function(){toast("Falha ao alterar o som","err")});
});
$("#fCancel").addEventListener("click",function(){dlg.close()});
dlg.addEventListener("click",function(e){if(e.target===dlg)dlg.close()});
fm.addEventListener("submit",function(e){e.preventDefault();salvar()});

document.addEventListener("keydown",function(e){
  if(dlg.open||e.ctrlKey||e.metaKey||e.altKey)return;
  var t=e.target;
  if(t&&(t.tagName==="INPUT"||t.tagName==="TEXTAREA"))return;
  if(t&&t.classList&&t.classList.contains("car")&&(e.key==="Enter"||e.key===" ")){
    e.preventDefault();selecionar(Number(t.dataset.id),true);return;
  }
  if(!D)return;
  if(e.key.length===1&&"01234".indexOf(e.key)>=0){setStatus(Number(e.key))}
  else if(e.key==="n"||e.key==="N"){e.preventDefault();if(!$("#btnNovo").disabled)abrirForm(null)}
  else if(e.key==="ArrowDown"||e.key==="ArrowUp"){
    var v=D.carros.filter(passa);
    if(!v.length)return;
    e.preventDefault();
    var i=v.findIndex(function(c){return c.id===sel});
    var d=e.key==="ArrowDown"?1:-1;
    selecionar(v[(i+d+v.length)%v.length].id,false);
    var s=document.querySelector(".car.sel");
    if(s)s.scrollIntoView({block:"nearest"});
  }
});

/* ---------- Tema ---------- */
function setTema(t){
  document.documentElement.dataset.theme=t;
  try{localStorage.setItem("tema",t)}catch(e){}
  $("#btnTema").innerHTML=ic(t==="light"?"moon":"sun");
}
$("#btnTema").addEventListener("click",function(){
  setTema(document.documentElement.dataset.theme==="light"?"dark":"light");
});
(function(){
  var t=null;
  try{t=localStorage.getItem("tema")}catch(e){}
  if(!t)t=(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)?"light":"dark";
  setTema(t);
})();

setHTML($("#btnSom"),ic("vol"));
poll();
setInterval(poll,1000);
setInterval(tick,1000);
tick();
})();
</script>
</body>
</html>
